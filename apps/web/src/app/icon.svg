<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" role="img" aria-label="Pagarés">
  <!--
    La marca del panel: cuadrado verde y documento blanco.
    Va rellena y no de trazo como en la barra lateral, porque a 16 píxeles —el
    tamaño real de una pestaña— un contorno de 1.75 se empasta y el documento
    deja de reconocerse. La silueta aguanta.
  -->
  <rect width="32" height="32" rx="8" fill="#0b7a5b"/>
  <path fill="#ffffff" d="M10 6.5h8.2L23 11.3V25a1.5 1.5 0 0 1-1.5 1.5h-11A1.5 1.5 0 0 1 9 25V8a1.5 1.5 0 0 1 1-1.5Z"/>
  <!-- La esquina doblada, en hueco: es lo que lo hace un documento y no una tarjeta. -->
  <path fill="#0b7a5b" d="M18.6 6.6 23 11h-4.4z"/>
  <rect x="12" y="16" width="8" height="2.1" rx="1.05" fill="#0b7a5b"/>
  <rect x="12" y="20" width="5" height="2.1" rx="1.05" fill="#0b7a5b"/>
</svg>
