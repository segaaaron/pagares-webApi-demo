packages:
  - 'apps/*'
  - 'packages/*'

# Scripts de instalación permitidos explícitamente. pnpm los bloquea por defecto
# (defensa de cadena de suministro); aquí se aprueban sólo los que hacen falta.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  esbuild: true
  sharp: true
  msgpackr-extract: true
  '@scarf/scarf': false
  argon2: true
