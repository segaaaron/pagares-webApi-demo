name: pagares

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: pagares
      POSTGRES_PASSWORD: pagares_local
      POSTGRES_DB: pagares
      TZ: America/Mexico_City
    ports: ["5432:5432"]
    volumes: ["./data/postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagares -d pagares"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: pagares
      MINIO_ROOT_PASSWORD: pagares_local
    ports: ["9000:9000", "9001:9001"]
    volumes: ["./data/minio:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Crea el bucket privado al arrancar. Sin lectura anónima (§9.1, API8).
  minio-init:
    image: minio/mc:latest
    depends_on:
      minio: { condition: service_healthy }
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 pagares pagares_local &&
      mc mb --ignore-existing local/pagares-media &&
      mc anonymous set none local/pagares-media &&
      echo 'bucket pagares-media listo (privado)'
      "

  mailpit:
    image: axllent/mailpit:latest
    ports: ["1025:1025", "8025:8025"]
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10
